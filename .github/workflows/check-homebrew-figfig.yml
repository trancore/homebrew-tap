name: chack homebrew figfig
on:
  push:
    branches: ['**']
    paths:
      - "Formula/**"
      - ".github/actions/setup-intel-homebrew/**"
      - ".github/workflows/check-homebrew-figfig.yml"
      - ".github/workflows/formula.yml"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/actions/setup-intel-homebrew/**"
      - ".github/workflows/check-homebrew-figfig.yml"
      - ".github/workflows/formula.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    name: >-
      ${{ (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch)
          && 'Apple Silicon runs on the PR' || 'verify (xcode-27)' }}
    runs-on: xcode-27
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - &check_formula
        name: Check for a published formula
        id: formula
        run: |
          if [ -f Formula/figfig.rb ]; then
            ruby -c Formula/figfig.rb
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No published release yet. Add the verified release's Formula/figfig.rb to enable installation checks."
          fi
      - uses: Homebrew/actions/setup-homebrew@2026.11.14.1
        if: steps.formula.outputs.present == 'true'
      - name: Register this checkout as the tap
        if: steps.formula.outputs.present == 'true'
        run: |
          brew tap --custom-remote trancore/tap "$GITHUB_WORKSPACE"
          brew trust --formula trancore/tap/figfig
      - &audit_formula
        name: Check formula style and metadata
        if: steps.formula.outputs.present == 'true'
        run: |
          brew style trancore/tap/figfig
          brew audit --strict trancore/tap/figfig
      - &test_formula
        name: Build and test the source release
        if: steps.formula.outputs.present == 'true'
        run: |
          brew install --build-from-source trancore/tap/figfig
          brew test trancore/tap/figfig
      - &check_uninstall
        name: Check uninstallation
        if: always() && steps.formula.outputs.present == 'true'
        shell: bash
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          if brew list --formula figfig >/dev/null 2>&1; then
            uninstall_args=(--force)
            if [[ "$RUNNER_ARCH" == X64 ]]; then
              # The pinned Intel tap can recurse through migrations of unrelated runner packages.
              uninstall_args+=(--ignore-dependencies)
            fi
            brew uninstall "${uninstall_args[@]}" trancore/tap/figfig
            ! brew list --versions figfig >/dev/null 2>&1
          fi

  verify-intel:
    # Same-repository PRs use the push check so it can restore the source branch's cache.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
          && 'Intel runs on the source branch' || 'verify (macos-26-intel)' }}
    runs-on: macos-26-intel
    timeout-minutes: 30
    cache-mode: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ASK: "1"
    steps:
      - *checkout
      - *check_formula
      - name: Set up pinned Homebrew
        id: homebrew
        if: steps.formula.outputs.present == 'true'
        uses: ./.github/actions/setup-intel-homebrew
      - name: Restore the prepared build dependencies
        id: dependencies
        if: steps.formula.outputs.present == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          TAR_OPTIONS: ${{ steps.homebrew.outputs.cache-tar-options }}
        with:
          key: ${{ steps.homebrew.outputs.dependencies-key }}
          path: ${{ steps.homebrew.outputs.dependencies-paths }}
      - name: Require a complete dependency cache
        if: steps.formula.outputs.present == 'true'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != true ]]; then
            echo '::error::Intel dependencies are unavailable. Run Prepare Intel Homebrew dependencies (formula.yml) on this branch or main, then rerun the check.'
            exit 1
          fi
          bash .github/actions/setup-intel-homebrew/check-dependencies.sh
      - *audit_formula
      - *test_formula
      - *check_uninstall
